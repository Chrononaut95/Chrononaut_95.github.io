<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Raum</title>
  <style>
    html, body { margin: 0; height: 100%; background: #222; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
    canvas { width: 100%; height: 100%; display: block; }
    #stickBasis, #stickKnopf { position: fixed; border-radius: 50%; display: none; pointer-events: none; z-index: 5; }
    #stickBasis { width: 110px; height: 110px; margin: -55px 0 0 -55px; border: 2px solid rgba(255,255,255,.45); background: rgba(255,255,255,.08); }
    #stickKnopf { width: 48px; height: 48px; margin: -24px 0 0 -24px; background: rgba(255,255,255,.5); }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body>
<div id="stickBasis"></div>
<div id="stickKnopf"></div>
<script type="module">
  import * as THREE from 'three';

  // ---------- Einstellungen ----------
  const DATEI = 'images/object_';     // Objekt-Bilder: images/object_0.png ... object_3.png
  const ANZAHL = 4;                   // 0 = vorne, 1 = rechts, 2 = hinten, 3 = links
  const WAND = 'images/wall_';        // Wand-Bilder: images/wall_front.png usw.
  const WAND_ENDUNG = '.png';         // bei JPG-Bildern: '.jpg'

  const WANDBREITE = 12;                         // Breite jeder Wand (Raum ist quadratisch)
  const RAUMHOEHE = WANDBREITE * 960 / 1280;     // Höhe passend zum Bildformat 1280 x 960 (4:3)
  const RAUM = WANDBREITE / 2;                   // halbe Raumbreite
  const AUGE = 2.2;                              // Augenhöhe der Kamera

  const OBJEKT_HOEHE = 2.5;                      // Höhe des Objekts im Raum
  const OBJEKT_BREITE = OBJEKT_HOEHE * 448 / 640; // Breite passend zum Bildformat (448 x 640 px)
  const OBJEKT_RADIUS = 1.5;                     // Mindestabstand zum Objekt

  const TEMPO = 4;       // Laufgeschwindigkeit
  const DREHTEMPO = 2;   // Drehgeschwindigkeit (Tasten Q/E)
  const WISCH = 0.006;   // Empfindlichkeit beim Umsehen per Wischen am Handy
  const STICK = 50;      // Reichweite des Handy-Sticks in Pixeln
  const MAX_NEIGUNG = 0.6; // wie weit man hoch/runter schauen darf (Bogenmaß, ca. 35°)

  // Roter Balken oben, falls ein Bild nicht geladen werden kann
  function meldung(text) {
    const d = document.createElement('div');
    d.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#c00;color:#fff;font:14px sans-serif;padding:6px;z-index:9';
    d.textContent = text;
    document.body.appendChild(d);
  }

  // ---------- Szene ----------
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x333333);
  const cam = new THREE.PerspectiveCamera(70, 1, 0.1, 100);
  cam.position.set(0, AUGE, RAUM - 2);
  cam.rotation.order = 'YXZ';

  function groesse() {
    renderer.setSize(innerWidth, innerHeight, false);
    cam.aspect = innerWidth / innerHeight;
    cam.updateProjectionMatrix();
  }
  addEventListener('resize', groesse);
  groesse();

  const loader = new THREE.TextureLoader();
  function textur(pfad) {
    const t = loader.load(pfad, undefined, undefined, () => meldung('Bild fehlt: ' + pfad));
    t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return t;
  }

  // Wände: Blick beim Start geht auf die Wand "front"
  function wandBauen(name, x, z, drehung) {
    const m = new THREE.Mesh(
      new THREE.PlaneGeometry(WANDBREITE, RAUMHOEHE),
      new THREE.MeshBasicMaterial({ map: textur(WAND + name + WAND_ENDUNG) })
    );
    m.position.set(x, RAUMHOEHE / 2, z);
    m.rotation.y = drehung;
    scene.add(m);
  }
  wandBauen('front', 0, -RAUM, 0);              // vor dir beim Start
  wandBauen('back',  0,  RAUM, Math.PI);        // hinter dir beim Start
  wandBauen('left', -RAUM, 0,  Math.PI / 2);    // links
  wandBauen('right', RAUM, 0, -Math.PI / 2);    // rechts

  // Boden und Decke: dunkelgrau
  const dunkel = new THREE.MeshBasicMaterial({ color: 0x333333 });
  const boden = new THREE.Mesh(new THREE.PlaneGeometry(WANDBREITE, WANDBREITE), dunkel);
  boden.rotation.x = -Math.PI / 2;
  scene.add(boden);
  const decke = new THREE.Mesh(new THREE.PlaneGeometry(WANDBREITE, WANDBREITE), dunkel);
  decke.rotation.x = Math.PI / 2;
  decke.position.y = RAUMHOEHE;
  scene.add(decke);

  // Objekt: flache Fläche mit den Bildern
  const bilder = [];
  for (let i = 0; i < ANZAHL; i++) bilder.push(textur(`${DATEI}${i}.png`));
  const objekt = new THREE.Mesh(
    new THREE.PlaneGeometry(1, 1),
    new THREE.MeshBasicMaterial({ map: bilder[0], transparent: true, alphaTest: 0.5, side: THREE.DoubleSide })
  );
  objekt.scale.set(OBJEKT_BREITE, OBJEKT_HOEHE, 1);
  objekt.position.set(0, OBJEKT_HOEHE / 2, 0);
  scene.add(objekt);

  // ---------- Steuerung am Computer ----------
  // W/S = vor/zurück, A/D = seitlich, Q/E = drehen, R/F = hoch/runter schauen
  const tasten = {};
  addEventListener('keydown', e => tasten[e.code] = true);
  addEventListener('keyup', e => tasten[e.code] = false);
  addEventListener('blur', () => { for (const k in tasten) tasten[k] = false; });

  // ---------- Steuerung am Handy ----------
  // Linke Hälfte: Stick zum Laufen. Rechte Hälfte: wischen = umsehen (auch hoch/runter).
  const stickBasis = document.getElementById('stickBasis');
  const stickKnopf = document.getElementById('stickKnopf');
  let stickId = null, stickX = 0, stickY = 0;
  let stickVecX = 0, stickVecY = 0;
  let blickId = null, blickX = 0, blickY = 0;
  let yaw = 0, neigung = 0;

  function setzePos(el, x, y) { el.style.left = x + 'px'; el.style.top = y + 'px'; }

  addEventListener('touchstart', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (t.clientX < innerWidth / 2 && stickId === null) {
        stickId = t.identifier; stickX = t.clientX; stickY = t.clientY;
        setzePos(stickBasis, stickX, stickY); setzePos(stickKnopf, stickX, stickY);
        stickBasis.style.display = 'block'; stickKnopf.style.display = 'block';
      } else if (t.clientX >= innerWidth / 2 && blickId === null) {
        blickId = t.identifier; blickX = t.clientX; blickY = t.clientY;
      }
    }
  }, { passive: false });

  addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (t.identifier === stickId) {
        let dx = t.clientX - stickX, dy = t.clientY - stickY;
        const len = Math.hypot(dx, dy);
        if (len > STICK) { dx = dx / len * STICK; dy = dy / len * STICK; }
        stickVecX = dx / STICK; stickVecY = dy / STICK;
        setzePos(stickKnopf, stickX + dx, stickY + dy);
      } else if (t.identifier === blickId) {
        yaw -= (t.clientX - blickX) * WISCH;
        neigung -= (t.clientY - blickY) * WISCH;
        neigung = Math.max(-MAX_NEIGUNG, Math.min(MAX_NEIGUNG, neigung));
        blickX = t.clientX; blickY = t.clientY;
      }
    }
  }, { passive: false });

  function touchEnde(e) {
    for (const t of e.changedTouches) {
      if (t.identifier === stickId) {
        stickId = null; stickVecX = 0; stickVecY = 0;
        stickBasis.style.display = 'none'; stickKnopf.style.display = 'none';
      } else if (t.identifier === blickId) {
        blickId = null;
      }
    }
  }
  addEventListener('touchend', touchEnde);
  addEventListener('touchcancel', touchEnde);

  // ---------- Hauptschleife ----------
  let letzte = performance.now();
  function schleife(jetzt) {
    const dt = Math.min((jetzt - letzte) / 1000, 0.05);
    letzte = jetzt;

    // Drehen mit Q/E (oder Pfeil links/rechts), hoch/runter schauen mit R/F
    yaw += ((tasten.KeyQ || tasten.ArrowLeft ? 1 : 0) - (tasten.KeyE || tasten.ArrowRight ? 1 : 0)) * DREHTEMPO * dt;
    neigung += ((tasten.KeyR ? 1 : 0) - (tasten.KeyF ? 1 : 0)) * DREHTEMPO * dt;
    neigung = Math.max(-MAX_NEIGUNG, Math.min(MAX_NEIGUNG, neigung));

    // Laufen: vor/zurück und seitlich, Tasten und Stick zusammen
    let vor = (tasten.KeyW || tasten.ArrowUp ? 1 : 0) - (tasten.KeyS || tasten.ArrowDown ? 1 : 0) - stickVecY;
    let seit = (tasten.KeyD ? 1 : 0) - (tasten.KeyA ? 1 : 0) + stickVecX;
    const laenge = Math.hypot(vor, seit);
    if (laenge > 1) { vor /= laenge; seit /= laenge; }
    const s = Math.sin(yaw), c = Math.cos(yaw);
    cam.position.x += (-s * vor + c * seit) * TEMPO * dt;
    cam.position.z += (-c * vor - s * seit) * TEMPO * dt;

    // Raumgrenzen
    const grenze = RAUM - 0.5;
    cam.position.x = Math.max(-grenze, Math.min(grenze, cam.position.x));
    cam.position.z = Math.max(-grenze, Math.min(grenze, cam.position.z));

    // Nicht durchs Objekt laufen
    const dx = cam.position.x - objekt.position.x;
    const dz = cam.position.z - objekt.position.z;
    const abstand = Math.hypot(dx, dz);
    if (abstand < OBJEKT_RADIUS) {
      cam.position.x = objekt.position.x + (dx / abstand) * OBJEKT_RADIUS;
      cam.position.z = objekt.position.z + (dz / abstand) * OBJEKT_RADIUS;
    }
    cam.rotation.y = yaw;
    cam.rotation.x = neigung;

    // Objekt dreht sich zur Kamera, passendes Bild wählen
    const a = Math.atan2(dx, dz);
    objekt.rotation.y = a;
    let index = Math.round((a / (Math.PI * 2)) * ANZAHL);
    index = ((index % ANZAHL) + ANZAHL) % ANZAHL;
    objekt.material.map = bilder[index];

    renderer.render(scene, cam);
    requestAnimationFrame(schleife);
  }
  requestAnimationFrame(schleife);
</script>
</body>
</html>
