<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Raum</title>
  <style>
    html, body { margin: 0; height: 100%; background: #222; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
    canvas { width: 100%; height: 100%; display: block; }
    #start { position: fixed; inset: 0; z-index: 8; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.55); color: #fff; font: 22px sans-serif; cursor: pointer; }
    #stickBasis, #stickKnopf { position: fixed; border-radius: 50%; display: none; pointer-events: none; z-index: 5; }
    #stickBasis { width: 110px; height: 110px; margin: -55px 0 0 -55px; border: 2px solid rgba(255,255,255,.45); background: rgba(255,255,255,.08); }
    #stickKnopf { width: 48px; height: 48px; margin: -24px 0 0 -24px; background: rgba(255,255,255,.5); }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body>
<div id="start">Tippen zum Starten</div>
<div id="stickBasis"></div>
<div id="stickKnopf"></div>
<script type="module">
  import * as THREE from 'three';

  // ---------- Einstellungen ----------
  const BILD = 'images/object_';
  const WAND = 'images/wall_';
  const WAND_ENDUNG = '.png';

  // ansichten: pro Blickrichtung [Mund zu, Mund offen]
  // Fuchs: 0 = von vorne, 1 = Schnauze links, 2 = von hinten, 3 = Schnauze rechts
  // Socke: vorne, dann immer weiter nach rechts um sie herum
  const OBJEKTE = [
    { // Fuchs: die steuerbare Figur
      steuerbar: true,
      x: 0, z: 2.2, hoehe: 2.5, seite: 448 / 640, radius: 0.6,
      ansichten: [[0], [1], [2], [3]]
    },
    { // Socke: steht in der Mitte und singt
      x: 0, z: 0, hoehe: 2.5, seite: 706 / 640, radius: 1.2,
      mund: true,
      lied: 'sounds/lied.mp3',
      // Zum Kreislaufen die nächste Zeile aktivieren (// entfernen):
      bahn: { mx: 0, mz: 0, radius: 3, umlauf: 20, start: 0, richtung: 1 },
      ansichten: [[4, 5], [6, 7], [8, 9], [10, 11], [12, 12], [13, 14], [15, 16], [17, 18]]
    }
  ];
  const MUND_MIN = 0.5, MUND_MAX = 1.5;   // Mundwechsel in Sekunden

  const WANDBREITE = 12;
  const RAUMHOEHE = WANDBREITE * 960 / 1280;
  const RAUM = WANDBREITE / 2;

  const CAM_ABSTAND = 4;    // Abstand der Kamera zum Fuchs
  const START_ELEV = 0.3;   // Anfangshöhe der Kamera (Bogenmaß)
  const ZIEL_Y = 1.3;       // Höhe, auf die die Kamera zielt
  const TEMPO = 4;          // Laufgeschwindigkeit
  const DREHTEMPO = 2;      // Schwenken mit Q/E
  const WISCH = 0.006;      // Wischen am Handy
  const STICK = 50;
  const MAX_NEIGUNG = 0.6;

  function meldung(text) {
    const d = document.createElement('div');
    d.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#c00;color:#fff;font:14px sans-serif;padding:6px;z-index:9';
    d.textContent = text;
    document.body.appendChild(d);
  }

  // ---------- Szene ----------
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x333333);
  const cam = new THREE.PerspectiveCamera(70, 1, 0.1, 100);
  const hoerer = new THREE.AudioListener();
  cam.add(hoerer);

  function groesse() {
    renderer.setSize(innerWidth, innerHeight, false);
    cam.aspect = innerWidth / innerHeight;
    cam.updateProjectionMatrix();
  }
  addEventListener('resize', groesse);
  groesse();

  const loader = new THREE.TextureLoader();
  const speicher = {};
  function textur(pfad) {
    if (speicher[pfad]) return speicher[pfad];
    const t = loader.load(pfad, undefined, undefined, () => meldung('Bild fehlt: ' + pfad));
    t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return (speicher[pfad] = t);
  }

  function wandBauen(name, x, z, drehung) {
    const m = new THREE.Mesh(
      new THREE.PlaneGeometry(WANDBREITE, RAUMHOEHE),
      new THREE.MeshBasicMaterial({ map: textur(WAND + name + WAND_ENDUNG) })
    );
    m.position.set(x, RAUMHOEHE / 2, z);
    m.rotation.y = drehung;
    scene.add(m);
  }
  wandBauen('front', 0, -RAUM, 0);
  wandBauen('back',  0,  RAUM, Math.PI);
  wandBauen('left', -RAUM, 0,  Math.PI / 2);
  wandBauen('right', RAUM, 0, -Math.PI / 2);

  const dunkel = new THREE.MeshBasicMaterial({ color: 0x333333 });
  const boden = new THREE.Mesh(new THREE.PlaneGeometry(WANDBREITE, WANDBREITE), dunkel);
  boden.rotation.x = -Math.PI / 2;
  scene.add(boden);
  const decke = new THREE.Mesh(new THREE.PlaneGeometry(WANDBREITE, WANDBREITE), dunkel);
  decke.rotation.x = Math.PI / 2;
  decke.position.y = RAUMHOEHE;
  scene.add(decke);

  // ---------- Objekte ----------
  const audioLader = new THREE.AudioLoader();
  for (const o of OBJEKTE) {
    o.texturen = o.ansichten.map(paar => paar.map(nr => textur(`${BILD}${nr}.png`)));
    o.offen = false;
    o.singt = false;
    o.timer = MUND_MIN + Math.random() * (MUND_MAX - MUND_MIN);
    o.kurs = 0;
    o.winkel = o.bahn ? o.bahn.start * Math.PI / 180 : 0;
    o.mesh = new THREE.Mesh(
      new THREE.PlaneGeometry(1, 1),
      new THREE.MeshBasicMaterial({ map: o.texturen[0][0], transparent: true, alphaTest: 0.5, side: THREE.DoubleSide })
    );
    o.mesh.scale.set(o.hoehe * o.seite, o.hoehe, 1);
    scene.add(o.mesh);
    if (o.lied) {
      o.klang = new THREE.PositionalAudio(hoerer);
      o.klang.setLoop(true);
      o.klang.setRefDistance(5);
      o.klang.setRolloffFactor(0.8);
      o.mesh.add(o.klang);
      audioLader.load(o.lied, buf => o.klang.setBuffer(buf), undefined, () => meldung('Sound fehlt: ' + o.lied));
    }
  }
  const fuchs = OBJEKTE.find(o => o.steuerbar);

  // Start-Fläche (Browser erlauben Ton erst nach einem Tipp)
  const startFeld = document.getElementById('start');
  if (!OBJEKTE.some(o => o.lied)) startFeld.style.display = 'none';
  startFeld.addEventListener('click', () => {
    hoerer.context.resume();
    for (const o of OBJEKTE) {
      if (!o.klang) continue;
      o.singt = true;
      if (o.klang.buffer && !o.klang.isPlaying) o.klang.play(); else o.klang.autoplay = true;
    }
    startFeld.style.display = 'none';
  });

  // ---------- Steuerung ----------
  // W/S/A/D = laufen (aus Sicht der Kamera), Q/E = um den Fuchs schwenken, R/F = Kamera tiefer/höher
  const tasten = {};
  addEventListener('keydown', e => tasten[e.code] = true);
  addEventListener('keyup', e => tasten[e.code] = false);
  addEventListener('blur', () => { for (const k in tasten) tasten[k] = false; });

  // Handy: links Stick zum Laufen, rechts wischen zum Schwenken
  const stickBasis = document.getElementById('stickBasis');
  const stickKnopf = document.getElementById('stickKnopf');
  let stickId = null, stickX = 0, stickY = 0, stickVecX = 0, stickVecY = 0;
  let blickId = null, blickX = 0, blickY = 0;
  let yaw = 0, neigung = 0, yv = 0;
  const setzePos = (el, x, y) => { el.style.left = x + 'px'; el.style.top = y + 'px'; };
  const imStart = e => e.target.closest && e.target.closest('#start');

  addEventListener('touchstart', e => {
    if (imStart(e)) return;
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (t.clientX < innerWidth / 2 && stickId === null) {
        stickId = t.identifier; stickX = t.clientX; stickY = t.clientY;
        setzePos(stickBasis, stickX, stickY); setzePos(stickKnopf, stickX, stickY);
        stickBasis.style.display = 'block'; stickKnopf.style.display = 'block';
      } else if (t.clientX >= innerWidth / 2 && blickId === null) {
        blickId = t.identifier; blickX = t.clientX; blickY = t.clientY;
      }
    }
  }, { passive: false });

  addEventListener('touchmove', e => {
    if (imStart(e)) return;
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (t.identifier === stickId) {
        let dx = t.clientX - stickX, dy = t.clientY - stickY;
        const len = Math.hypot(dx, dy);
        if (len > STICK) { dx = dx / len * STICK; dy = dy / len * STICK; }
        stickVecX = dx / STICK; stickVecY = dy / STICK;
        setzePos(stickKnopf, stickX + dx, stickY + dy);
      } else if (t.identifier === blickId) {
        yaw -= (t.clientX - blickX) * WISCH;
        neigung -= (t.clientY - blickY) * WISCH;
        neigung = Math.max(-MAX_NEIGUNG, Math.min(MAX_NEIGUNG, neigung));
        blickX = t.clientX; blickY = t.clientY;
      }
    }
  }, { passive: false });

  function touchEnde(e) {
    for (const t of e.changedTouches) {
      if (t.identifier === stickId) {
        stickId = null; stickVecX = 0; stickVecY = 0;
        stickBasis.style.display = 'none'; stickKnopf.style.display = 'none';
      } else if (t.identifier === blickId) {
        blickId = null;
      }
    }
  }
  addEventListener('touchend', touchEnde);
  addEventListener('touchcancel', touchEnde);

  // ---------- Hauptschleife ----------
  let hx = 0, hz = -1;   // Laufrichtung des Fuchses (Start: von der Kamera weg)
  let letzte = performance.now();
  function schleife(jetzt) {
    const dt = Math.min((jetzt - letzte) / 1000, 0.05);
    letzte = jetzt;

    // Kamera um den Fuchs schwenken
    yaw += ((tasten.KeyQ || tasten.ArrowLeft ? 1 : 0) - (tasten.KeyE || tasten.ArrowRight ? 1 : 0)) * DREHTEMPO * dt;
    neigung += ((tasten.KeyR ? 1 : 0) - (tasten.KeyF ? 1 : 0)) * DREHTEMPO * dt;
    neigung = Math.max(-MAX_NEIGUNG, Math.min(MAX_NEIGUNG, neigung));

    // Laufen: W = von der Kamera weg, S = auf die Kamera zu, A/D = seitlich
    let vor = (tasten.KeyW || tasten.ArrowUp ? 1 : 0) - (tasten.KeyS || tasten.ArrowDown ? 1 : 0) - stickVecY;
    let seit = (tasten.KeyD ? 1 : 0) - (tasten.KeyA ? 1 : 0) + stickVecX;
    const laenge = Math.hypot(vor, seit);
    if (laenge > 1) { vor /= laenge; seit /= laenge; }
    const fvx = -Math.sin(yv), fvz = -Math.cos(yv);   // Blickrichtung der Kamera
    const rvx = Math.cos(yv),  rvz = -Math.sin(yv);   // rechts
    const mx = fvx * vor + rvx * seit, mz = fvz * vor + rvz * seit;
    fuchs.x += mx * TEMPO * dt;
    fuchs.z += mz * TEMPO * dt;
    const ml = Math.hypot(mx, mz);
    if (ml > 0.1) { hx = mx / ml; hz = mz / ml; }

    // andere Objekte: Bahn und Mund
    for (const o of OBJEKTE) {
      if (o.steuerbar) continue;
      if (o.bahn) {
        const b = o.bahn;
        o.winkel += b.richtung * (Math.PI * 2 / b.umlauf) * dt;
        o.x = b.mx + b.radius * Math.cos(o.winkel);
        o.z = b.mz + b.radius * Math.sin(o.winkel);
        o.kurs = Math.atan2(-b.richtung * Math.sin(o.winkel), b.richtung * Math.cos(o.winkel));
      }
      if (o.mund) {
        if (o.singt) {
          o.timer -= dt;
          if (o.timer <= 0) { o.offen = !o.offen; o.timer = MUND_MIN + Math.random() * (MUND_MAX - MUND_MIN); }
        } else o.offen = false;
      }
      // Fuchs nicht durch andere Objekte laufen lassen
      const dx = fuchs.x - o.x, dz = fuchs.z - o.z, d = Math.hypot(dx, dz), mind = fuchs.radius + o.radius;
      if (d < mind && d > 0) { fuchs.x = o.x + dx / d * mind; fuchs.z = o.z + dz / d * mind; }
    }
    const g = RAUM - 0.8;
    fuchs.x = Math.max(-g, Math.min(g, fuchs.x));
    fuchs.z = Math.max(-g, Math.min(g, fuchs.z));

    // Kamera hinter dem Fuchs
    const e = Math.max(0.03, START_ELEV - neigung);
    const hor = CAM_ABSTAND * Math.cos(e);
    const gc = RAUM - 0.3;
    const cx = Math.max(-gc, Math.min(gc, fuchs.x + Math.sin(yaw) * hor));
    const cz = Math.max(-gc, Math.min(gc, fuchs.z + Math.cos(yaw) * hor));
    const cy = Math.min(ZIEL_Y + CAM_ABSTAND * Math.sin(e), RAUMHOEHE - 0.3);
    cam.position.set(cx, cy, cz);
    cam.lookAt(fuchs.x, ZIEL_Y, fuchs.z);
    yv = Math.atan2(-(fuchs.x - cx), -(fuchs.z - cz));

    // Bilder: immer plan zur Blickrichtung, passende Ansicht wählen
    const fx = -Math.sin(yv), fz = -Math.cos(yv), rx = Math.cos(yv), rz = -Math.sin(yv);
    for (const o of OBJEKTE) {
      o.mesh.position.set(o.x, o.hoehe / 2, o.z);
      o.mesh.rotation.y = yv;
      let paar;
      if (o.steuerbar) {
        // Laufrichtung relativ zur Kamera: 0 = weg von dir, 90° = nach rechts, 180° = auf dich zu
        const phi = Math.atan2(hx * rx + hz * rz, hx * fx + hz * fz);
        const w = Math.abs(phi);
        const index = w < 1.178 ? 2 : (w > 1.963 ? 0 : (phi > 0 ? 3 : 1));
        paar = o.texturen[index];
      } else {
        const a = Math.atan2(cx - o.x, cz - o.z) - o.kurs;
        const n = o.ansichten.length;
        let index = Math.round((a / (Math.PI * 2)) * n);
        index = ((index % n) + n) % n;
        paar = o.texturen[index];
      }
      o.mesh.material.map = (o.offen && paar[1]) ? paar[1] : paar[0];
    }

    renderer.render(scene, cam);
    requestAnimationFrame(schleife);
  }
  requestAnimationFrame(schleife);
</script>
</body>
</html>
