<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mein Haus</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
  <style>
    body { margin: 0; }
    #panorama { width: 100%; height: 100vh; }
  </style>
</head>
<body>
  <div id="panorama"></div>
  <script>
    // Winkel vom linken Bildrand (0-360°) in Pannellum-Yaw umrechnen.
    // Bildmitte = 180° = Yaw 0.
    const w = grad => grad - 180;

    pannellum.viewer('panorama', {
      default: { firstScene: 'raum1', sceneFadeDuration: 1000 },
      scenes: {
        raum1: {
          title: 'Raum 1',
          type: 'equirectangular',
          panorama: 'images/raum1.jpg',
          yaw: 0, pitch: 0, hfov: 100,
          hotSpots: [
            { pitch: 0, yaw: w(80),  type: 'scene', text: 'Raum 2', sceneId: 'raum2' },
            { pitch: 0, yaw: w(195), type: 'scene', text: 'Raum 4', sceneId: 'raum4' }
          ]
        },
        raum2: {
          title: 'Raum 2',
          type: 'equirectangular',
          panorama: 'images/raum2.jpg',
          yaw: 0, pitch: 0, hfov: 100,
          hotSpots: [
            { pitch: 0, yaw: w(170), type: 'scene', text: 'Raum 3', sceneId: 'raum3' },
            { pitch: 0, yaw: w(0),   type: 'scene', text: 'Zurück zu Raum 1', sceneId: 'raum1' }
          ]
        },
        raum3: {
          title: 'Raum 3',
          type: 'equirectangular',
          panorama: 'images/raum3.jpg',
          yaw: 0, pitch: 0, hfov: 100,
          hotSpots: [
            { pitch: 0, yaw: w(0), type: 'scene', text: 'Zurück zu Raum 2', sceneId: 'raum2' }
          ]
        },
        raum4: {
          title: 'Raum 4',
          type: 'equirectangular',
          panorama: 'images/raum4.jpg',
          yaw: 0, pitch: 0, hfov: 100,
          hotSpots: [
            { pitch: 0, yaw: w(0), type: 'scene', text: 'Zurück zu Raum 1', sceneId: 'raum1' }
          ]
        }
      }
    });
  </script>
</body>
</html>
