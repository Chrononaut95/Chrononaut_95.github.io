<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mein Haus</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
  <style>
    body { margin: 0; }
    #panorama { width: 100%; height: 100vh; }
  </style>
</head>
<body>
  <div id="panorama"></div>
  <script>
    pannellum.viewer('panorama', {
      default: { firstScene: 'raum1', sceneFadeDuration: 1000 },
      scenes: {
        raum1: {
          title: 'Raum 1',
          type: 'equirectangular',
          panorama: 'images/raum1.jpg',
          hotSpots: [
            { pitch: 0, yaw: 90, type: 'scene', text: 'Weiter zu Raum 2', sceneId: 'raum2' }
          ]
        },
        raum2: {
          title: 'Raum 2',
          type: 'equirectangular',
          panorama: 'images/raum2.jpg',
          hotSpots: [
            { pitch: 0, yaw: -90, type: 'scene', text: 'Zurück zu Raum 1', sceneId: 'raum1' }
          ]
        }
      }
    });
  </script>
</body>
</html>
